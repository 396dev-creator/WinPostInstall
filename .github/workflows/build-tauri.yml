name: Build & Release Tauri App

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "tool-results/**"
      - "skills/**"
      - "examples/**"

concurrency:
  group: build-tauri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend deps
        run: npm install

      - name: Build Next.js frontend (Tauri mode)
        run: npx next build
        env:
          BUILD_MODE: tauri

      - name: Install Tauri CLI
        run: npm install @tauri-apps/cli

      - name: Build Tauri app
        run: npx tauri build
        env:
          BUILD_MODE: tauri

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinPostInstall-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.1.0-${{ github.run_number }}
          name: "WinPostInstall v4.1.0 (build #${{ github.run_number }})"
          body: |
            Auto-built from commit ${{ github.sha }}

            **Download the installer (.exe) below.**
          draft: false
          prerelease: false
          files: src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
