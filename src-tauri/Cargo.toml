[package]
name = "winpostinstall"
version = "4.1.0"
description = "WinPostInstall Desktop Application"
authors = ["you"]
edition = "2021"

[lib]
name = "winpostinstall_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
